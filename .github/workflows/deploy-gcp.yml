name: Deploy to Cloud Run (GCP)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "web-app/app/**"
      - ".github/workflows/deploy-gcp.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Cloud Run v2
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.GCP_PROJECT_ID != '' &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.GCP_DEPLOYER_SERVICE_ACCOUNT != '')
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
      GCP_SERVICE_NAME: ${{ vars.GCP_SERVICE_NAME || 'agent-ready-app' }}
      GCP_AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY || vars.GCP_SERVICE_NAME || 'agent-ready-app' }}
    steps:
      - name: Validate GCP WIF Variables
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GCP_PROJECT_ID" ] || [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] || [ -z "$GCP_DEPLOYER_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing required GitHub repository variables: GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, and GCP_DEPLOYER_SERVICE_ACCOUNT. See web-app/infra/gcp/README.md for setup instructions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (Access Token for Artifact Registry)
        id: auth-docker
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth-docker.outputs.access_token }}

      - name: Build and Push Distroless Image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: web-app/app
          file: web-app/app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPOSITORY }}/${{ env.GCP_SERVICE_NAME }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPOSITORY }}/${{ env.GCP_SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Authenticate to Google Cloud (ADC for Cloud Run Deploy)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run v2
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          service: ${{ env.GCP_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPOSITORY }}/${{ env.GCP_SERVICE_NAME }}@${{ steps.build-push.outputs.digest }}
          env_vars: ENABLE_E2E_PASSWORD_AUTH=false
          flags: --min-instances=0 --cpu-throttling

      - name: Write Deployment Summary
        run: |
          {
            echo "### Cloud Run v2 Deployment"
            echo "- **Service:** \`${GCP_SERVICE_NAME}\` (\`${GCP_REGION}\`)"
            echo "- **Image:** \`${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_AR_REPOSITORY}/${GCP_SERVICE_NAME}@${{ steps.build-push.outputs.digest }}\`"
            echo "- **URL:** ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
