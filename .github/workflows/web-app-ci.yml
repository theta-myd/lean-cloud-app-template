name: Web App CI

on:
  push:
    branches: ["main"]
    paths:
      - "web-app/app/**"
      - ".github/workflows/web-app-ci.yml"
  pull_request:
    paths:
      - "web-app/app/**"
      - ".github/workflows/web-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build-e2e:
    name: Check, Build & Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app/app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck & Svelte Check
        run: bun run --bun check

      - name: Unit Tests (Vitest)
        run: bun run test:unit

      - name: Production Build (adapter-bun)
        run: bun run --bun build

      - name: Verify Third-Party Licenses Artifact
        run: test -s build/licenses.txt

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E Smoke Tests
        env:
          ENABLE_E2E_PASSWORD_AUTH: "true"
          AUTH_ACCESS_MODE: "allowlist"
          BETTER_AUTH_SECRET: "e2e-test-only-better-auth-secret-0000"
          E2E_TEST_EMAIL: "e2e@example.com"
          E2E_TEST_PASSWORD: "e2e-local-password-1234"
        run: bun run test:e2e

  docker-build:
    name: Docker Distroless Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Distroless Container Image
        uses: docker/build-push-action@v7
        with:
          context: web-app/app
          file: web-app/app/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
