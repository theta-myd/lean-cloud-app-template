<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>Lean Cloud App</title>
  <defs>
    <linearGradient id="bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A263D" />
      <stop offset="52%" stop-color="#0E1629" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(262 212) rotate(90) scale(220 240)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.24" />
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#070B14" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rim" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.09" />
    </linearGradient>
    <linearGradient id="cloudWhite" x1="256" y1="128" x2="256" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5EFFB" />
    </linearGradient>
    <linearGradient id="leanAccent" x1="128" y1="364" x2="444" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="52%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <clipPath id="cloudClip">
      <path d="M 136 364 A 68 68 0 1 1 156.13 231.05 A 98 98 0 0 1 349.16 249.41 A 62 62 0 1 1 382 364 Z" />
    </clipPath>
  </defs>

  <!-- App icon squircle container -->
  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <rect width="512" height="512" rx="116" fill="url(#glow)" />
  <rect x="6" y="6" width="500" height="500" rx="110" stroke="url(#rim)" stroke-width="3" />

  <!-- Subtle grounding shadow -->
  <ellipse cx="256" cy="390" rx="164" ry="18" fill="#020617" opacity="0.52" />

  <!-- Minimalist geometric cloud body -->
  <g clip-path="url(#cloudClip)">
    <path d="M 136 364 A 68 68 0 1 1 156.13 231.05 A 98 98 0 0 1 349.16 249.41 A 62 62 0 1 1 382 364 Z" fill="url(#cloudWhite)" />
    <!-- Lean aerodynamic lower-right accent sweeping cleanly into the right valley (349.16, 249.41) -->
    <path d="M 106 368 C 200 362 276 320 349.16 249.41 L 372 226 L 456 226 L 456 376 L 106 376 Z" fill="url(#leanAccent)" />
    <!-- Crisp separation slice landing directly in the dome valley -->
    <path d="M 104 366 C 198 358 274 316 349.16 249.41 L 368 232" stroke="#0E1629" stroke-width="11" stroke-linecap="round" fill="none" />
  </g>
</svg>
