<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lean Cloud App — Desktop Setup</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #475569;
        --card: #f8fafc;
        --border: #e2e8f0;
        --code-bg: #f1f5f9;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --card: #18181b;
          --border: #27272a;
          --code-bg: #27272a;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        line-height: 1.6;
      }

      main {
        width: 100%;
        max-width: 34rem;
        padding: 1.75rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--card);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }

      p {
        margin: 0.5rem 0;
        color: var(--muted);
        font-size: 0.9375rem;
      }

      code,
      pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.85rem;
        background: var(--code-bg);
        border-radius: 0.375rem;
      }

      code {
        padding: 0.125rem 0.375rem;
      }

      pre {
        margin: 0.75rem 0 0;
        padding: 0.75rem 1rem;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lean Cloud App Desktop</h1>
      <p>
        No target application URL was configured for this release build. Set
        <code>LEAN_CLOUD_APP_URL</code> to your deployed Cloud Run URL (or run in dev mode against
        <code>http://localhost:5173</code>).
      </p>
      <pre>LEAN_CLOUD_APP_URL=https://&lt;service&gt;-&lt;hash&gt;.a.run.app</pre>
    </main>
  </body>
</html>
